<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ثبت مشخصات</title>
</head>
<body style="background-color: lightblue; text-align: center;">

    <h2>فرم ثبت مشخصات</h2>

    <label>نام خود را وارد کنید:</label>
    <input type="text" id="name">

    <br><br>

    <label>نام خانوادگی:</label>
    <input type="text" id="family">

    <br><br>

    <label>سن خود را انتخاب کنید:</label>
    <select id="age">
        <option value="">انتخاب سن</option>
        <script>
            for (let i = 1; i <= 99; i++) {
                document.write("<option>" + i + "</option>");
            }
        </script>
    </select>

    <br><br>

    <label>آدرس ایمیل:</label>
    <input type="email" id="email">

    <br><br>

    <button onclick="showInfo()">ثبت اطلاعات</button>

    <div id="result" style="background-color: yellow; color: black; margin: 20px; padding: 15px;"></div>

    <script>
        function showInfo() {
            let n = document.getElementById("name").value;
            let f = document.getElementById("family").value;
            let a = document.getElementById("age").value;
            let e = document.getElementById("email").value;

            document.getElementById("result").innerHTML =
                "<h3>مشخصات ثبت شده</h3>" +
                "نام: " + n + "<br>" +
                "نام خانوادگی: " + f + "<br>" +
                "سن: " + a + "<br>" +
                "ایمیل: " + e;
        }
    </script>

</body>
</html>
